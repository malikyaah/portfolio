<body>
<div class="wrap">
<section id="start" class="start"><h1>Quelle séance ?</h1><div class="muted">Choisis une fois. Ensuite tu ne touches presque plus qu’à poids, reps et « Valider ».</div><div class="session-grid"><button class="session" data-start="Push">Push<span>Pecs · épaules · triceps</span></button><button class="session" data-start="Pull">Pull<span>Dos · biceps</span></button><button class="session" data-start="Legs">Legs<span>Jambes</span></button><button class="session" data-start="Point faible">Point faible<span>Avant-bras · épaules · bras</span></button><button class="session" data-start="Autre">Autre<span>Séance libre</span></button></div></section>

<script>
(()=>{"use strict";const ENDPOINT="https://pxyliiahkbvpcedqvbqp.supabase.co/functions/v1/log-workout";const PRESETS={Push:["Développé couché","Développé incliné haltères","Développé épaules","Élévations latérales","Extension triceps poulie","Pec deck"],Pull:["Tirage vertical","Rowing","Rowing poulie","Reverse fly","Curl biceps","Curl marteau"],Legs:["Presse à cuisses","Squat","Soulevé de terre roumain","Leg curl","Leg extension","Mollets"],"Point faible":["Avant-bras poulie","Curl marteau","Élévations latérales","Extension triceps poulie","Curl biceps","Reverse fly"]};const $=id=>document.getElementById(id),now=()=>Date.now(),uid=()=>crypto.randomUUID?crypto.randomUUID():String(now())+Math.random().toString(36).slice(2),get=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),clock=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(Math.max(0,s%60)).padStart(2,"0")}`;const h=new URLSearchParams(location.hash.replace(/^#/,""));if(h.get("token")){localStorage.setItem("workout_token",h.get("token"));history.replaceState(null,"",location.pathname+location.search)}let TOKEN=localStorage.getItem("workout_token")||"";const S={active:get("active_workout",null),hist:get("exercise_history_v2",[]),custom:get("custom_exercises",{}),queue:get("sync_queue",[]),step:Number(localStorage.getItem("weight_step")||2.5),rpe:8,restEnd:Number(localStorage.getItem("rest_end")||0),restDefault:120,saving:false};if(S.active&&now()-S.active.startedAt>14*3600000){S.active=null;localStorage.removeItem("active_workout")}if(S.active&&!Array.isArray(S.active.sets))S.active.sets=[];function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1500)}function persist(){S.active?set("active_workout",S.active):localStorage.removeItem("active_workout")}function needToken(){if(!TOKEN)$("tokenModal").classList.remove("hidden
